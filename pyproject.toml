[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-contest-chunker"
version = "0.1.0"
description = "Memory-efficient pandas DataFrame chunking by datetime without splitting identical timestamps across chunks"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[tool.pytest.ini_options]
addopts = "-q"
